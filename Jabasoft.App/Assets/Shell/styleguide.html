<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <title>Stijlgids</title>
    <link rel="stylesheet" href="https://shared.jabasoft.local/jabasoft-theme.css" />
    <link rel="stylesheet" href="https://shared.jabasoft.local/vs-theme.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <script src="https://shared.jabasoft.local/theme.js"></script>
</head>
<body>
    <div class="styleguide">
        <aside class="styleguide-nav">
            <div class="styleguide-nav-header">
                <div class="styleguide-nav-tabs">
                    <button id="tab-pages" type="button" class="nav-tab active">Pagina's</button>
                    <button id="tab-components" type="button" class="nav-tab">Componenten</button>
                    <button id="tab-settings" type="button" class="nav-tab">Instellingen</button>
                </div>
                <div class="styleguide-nav-actions">
                    <button id="refresh-btn" type="button" title="Pagina's verversen">&#8635;</button>
                </div>
            </div>
            <div id="app-groups"></div>
            <div id="component-list" hidden></div>
            <div id="settings-list" class="styleguide-nav-empty" hidden>AI Connector</div>
        </aside>
        <div class="splitter" id="splitter-1"></div>
        <main class="styleguide-preview">
            <div class="styleguide-preview-header">
                <span id="preview-title">Kies een pagina</span>
                <div class="styleguide-preview-tools">
                    <button id="select-element-btn" type="button" class="tool-toggle">Selecteer element</button>
                    <button id="show-regions-btn" type="button" class="tool-toggle">Toon regio's</button>
                    <a id="preview-open" href="#" target="_blank" title="Openen in nieuw tabblad">&#8599;</a>
                </div>
            </div>
            <iframe id="preview-frame" title="Paginavoorbeeld"></iframe>
        </main>
        <div class="splitter" id="splitter-2"></div>
        <aside class="styleguide-css" id="theme-panel">
            <div class="styleguide-css-header">
                <span>jabasoft-theme.css</span>
                <button id="save-css-btn" type="button">Opslaan</button>
            </div>
            <textarea id="css-editor" spellcheck="false"></textarea>
            <div id="css-status" class="styleguide-css-status"></div>
        </aside>
        <aside class="styleguide-css component-panel" id="component-panel" hidden>
            <div class="styleguide-css-header">
                <span id="component-panel-title">Component</span>
                <button id="save-component-css-btn" type="button">Opslaan</button>
            </div>
            <iframe id="component-preview" title="Componentvoorbeeld"></iframe>
            <textarea id="component-css-editor" spellcheck="false" placeholder="Eigen CSS voor dit component..."></textarea>
            <div id="component-css-status" class="styleguide-css-status"></div>
            <div class="component-ai">
                <textarea id="ai-instructions" placeholder="Instructies voor AI (optioneel)"></textarea>
                <button id="generate-css-btn" type="button">Genereer CSS met AI</button>
            </div>
            <button id="materialize-btn" type="button" class="materialize-btn">Maak Blazor-component</button>
            <div id="materialize-result" class="styleguide-css-status"></div>
        </aside>
        <aside class="styleguide-css" id="settings-panel" hidden>
            <div class="styleguide-css-header">
                <span>AI Connector</span>
                <button id="ai-settings-save-btn" type="button">Opslaan</button>
            </div>
            <div class="settings-form">
                <label class="floating-panel-field">
                    <span>Provider</span>
                    <select id="ai-provider">
                        <option value="LmStudio">LM Studio</option>
                        <option value="Ollama">Ollama</option>
                    </select>
                </label>
                <label class="floating-panel-field">
                    <span>Server-URL</span>
                    <input id="ai-server-url" type="text" />
                </label>
                <label class="floating-panel-field">
                    <span>Model</span>
                    <select id="ai-model"></select>
                </label>
                <div class="floating-panel-actions">
                    <button id="ai-refresh-models-btn" type="button">Modellen ophalen</button>
                    <button id="ai-test-btn" type="button">Test verbinding</button>
                </div>
            </div>
            <div id="ai-settings-status" class="styleguide-css-status"></div>
        </aside>
    </div>

    <div id="picker-panel" class="floating-panel" hidden>
        <div class="floating-panel-header">Component opslaan</div>
        <pre id="picker-html-preview" class="picker-html-preview"></pre>
        <div class="floating-panel-actions">
            <button id="picker-parent-btn" type="button">&uarr; Bovenliggend element</button>
        </div>
        <input id="picker-name-input" type="text" placeholder="Naam (bv. InfoBlok)" />
        <div class="floating-panel-actions">
            <button id="picker-save-btn" type="button">Opslaan als component</button>
            <button id="picker-cancel-btn" type="button">Annuleren</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="styleguide.js"></script>
</body>
</html>
