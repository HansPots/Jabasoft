<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <title>Jabasoft</title>
    <link rel="stylesheet" href="https://shared.jabasoft.local/jabasoft-theme.css" />
    <link rel="stylesheet" href="https://shared.jabasoft.local/shell-menu.css" />
    <link rel="stylesheet" href="https://shared.jabasoft.local/shell-header.css" />
    <link rel="stylesheet" href="https://shared.jabasoft.local/shell-footer.css" />
    <link rel="stylesheet" href="https://shared.jabasoft.local/vs-theme.css" />
    <link rel="stylesheet" href="shell.css" />
    <script src="https://shared.jabasoft.local/theme.js"></script>
</head>
<body>
    <div class="shell">
        <header class="shell-header">
            <div class="brand">
                <span class="brand-mark"></span>
                <div>
                    <div class="brand-title">JABASOFT</div>
                    <div class="brand-subtitle">FAMILY DASHBOARD</div>
                </div>
            </div>
            <div class="signal">
                <div class="strip peach"></div>
                <div class="strip rose"></div>
            </div>
            <div class="controls">
                <!-- No min/max/close: this is a real WPF window with its own
                     native title bar, unlike the chromeless "--app" browser
                     windows TabStudio/LocalAiStudio/Stylebook run in when
                     opened standalone (see window-controls.js there). -->
                <button class="theme-toggle" title="Thema wisselen" onclick="window.jabasoftTheme && window.jabasoftTheme.set(document.documentElement.getAttribute('data-theme') === 'vs' ? 'lcars' : 'vs')">Thema</button>
            </div>
            <div class="header-panels">
                <section class="head-card">
                    <div class="card-title">Huidige locatie</div>
                    <div class="breadcrumb" id="header-location">
                        <span>Dashboard</span>
                    </div>
                </section>
                <section class="head-card">
                    <div class="card-title">Actieve app</div>
                    <div class="info-value" id="header-active-app">Geen</div>
                </section>
                <section class="head-card">
                    <div class="card-title">Tokens</div>
                    <div class="token-counts">
                        <span class="token-count"><span class="token-count-label">Totaal</span><span id="header-tokens-total">—</span></span>
                        <span class="token-count"><span class="token-count-label">Verzoeken</span><span id="header-tokens-requests">—</span></span>
                    </div>
                </section>
                <section class="head-card">
                    <div class="card-title">Activiteit</div>
                    <div class="log-scroll" id="header-activity-log">
                        <div class="log-line log-empty">Nog niets gelogd.</div>
                    </div>
                </section>
            </div>
        </header>
        <aside class="shell-menu" aria-label="Main navigation">
            <nav class="nav" id="nav"></nav>
            <div class="sidebar-foot"><span>v: 0.1.0-dev</span></div>
        </aside>
        <main class="shell-content">
            <iframe id="content" title="App content"></iframe>
        </main>
        <div class="shell-actionrail"></div>
        <footer class="shell-footer">
            <div class="footer-status">
                <span class="dot dot-success"></span>
                <span>SYSTEM HEALTH</span>
                <b>Gereed</b>
            </div>
            <div class="meters">
                <div class="meter"><b id="footer-cpu">CPU&nbsp; —</b><i id="footer-cpu-bar" style="--progress: 0%"></i></div>
                <div class="meter"><b id="footer-ram">RAM&nbsp; —</b><i id="footer-ram-bar" style="--progress: 0%"></i></div>
                <div class="meter"><b id="footer-vram">MODEL VRAM&nbsp; —</b><i id="footer-vram-bar" style="--progress: 0%"></i></div>
                <div class="meter queue"><b id="footer-requests">AI-VERZOEKEN&nbsp; —</b><i style="--progress: 0%"></i></div>
            </div>
        </footer>
    </div>
    <script src="config.js"></script>
    <script src="shell.js"></script>
</body>
</html>
